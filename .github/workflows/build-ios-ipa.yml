name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      runner_image:
        description: 'macOS runner image (e.g. macos-26 or macos-15)'
        required: true
        default: 'macos-26'
      rebuild_sysroot:
        description: 'Force rebuild sysroot?'
        type: boolean
        required: false
        default: false
      ipa_mode:
        description: 'Package mode'
        type: choice
        required: true
        default: 'ipa'
        options:
          - ipa
          - ipa-hv
      publish_release:
        description: 'Publish GitHub Release and update altstore.json'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_XCODE_PATH: ${{ vars.HOST_XCODE_PATH || '/Applications/Xcode.app' }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run static checks
        run: sh Tests/Static/run_all.sh --no-sdp

  build-ios-ipa:
    name: Build UTM iOS IPA (arm64 + Built-in StikJIT)
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'macos-26' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        shell: bash
        run: |
          if [ -d "${{ env.BUILD_XCODE_PATH }}" ]; then
            [[ "$(xcode-select -p)" == "${{ env.BUILD_XCODE_PATH }}"* ]] || sudo xcode-select -s "${{ env.BUILD_XCODE_PATH }}"
          fi
          xcodebuild -version

      - name: Setup Path
        shell: bash
        run: |
          echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Restore Sysroot Cache
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-iOS-arm64
          key: ios-arm64-stikjit-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/build_stikjit.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}-${{ github.run_id }}
          restore-keys: |
            ios-arm64-stikjit-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/build_stikjit.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}-

      - name: Install Sysroot Build Dependencies
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || inputs.rebuild_sysroot
        run: |
          brew uninstall cmake || true
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake xcodegen llvm spirv-llvm-translator spirv-tools libxcb libxrandr
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          gem install --user-install xcpretty
          rm -f /usr/local/lib/pkgconfig/*.pc

      - name: Build Sysroot (iOS arm64 + StikJIT)
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || inputs.rebuild_sysroot
        run: ./scripts/build_dependencies.sh -p ios -a arm64
        env:
          NCPU: 0

      - name: Save Sysroot Cache
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || inputs.rebuild_sysroot
        uses: actions/cache/save@v4
        with:
          path: ./sysroot-iOS-arm64
          key: ios-arm64-stikjit-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/build_stikjit.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}-${{ github.run_id }}
          upload-chunk-size: 1048576

      - name: Static Checks (SDP)
        run: sh Tests/Static/run_all.sh --sdp-only

      - name: Install Packaging Tools
        run: |
          brew install ldid
          if [ ! -d "sysroot-iOS-arm64/Frameworks/StikJIT.framework" ]; then
            command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          fi

      - name: Build UTM Archive
        run: ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM

      - name: Package IPA
        run: ./scripts/package.sh "${{ inputs.ipa_mode }}" UTM.xcarchive out

      - name: Upload UTM IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTM-iOS-StikJIT-${{ inputs.ipa_mode }}
          path: out/UTM.ipa
          if-no-files-found: error

      - name: Publish Release and Update AltStore Source
        if: inputs.publish_release && inputs.ipa_mode == 'ipa'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F' *= *' '/^MARKETING_VERSION[[:space:]]*=/{print $2}' Build.xcconfig | tr -d '\r')"
          BUILD_NUM="$(awk -F' *= *' '/^CURRENT_PROJECT_VERSION[[:space:]]*=/{print $2}' Build.xcconfig | tr -d '\r')"
          TAG="v${VERSION}-stikjit.${GITHUB_RUN_NUMBER}"
          IPA_PATH="out/UTM.ipa"
          IPA_SIZE="$(wc -c < "$IPA_PATH" | tr -d '[:space:]')"
          IPA_SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="${GITHUB_REPOSITORY}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/UTM.ipa"

          gh release create "$TAG" "$IPA_PATH" \
            --title "UTM ${VERSION} (Built-in StikJIT #${GITHUB_RUN_NUMBER})" \
            --notes "Built from \`${GITHUB_SHA}\` (${VERSION} / build ${BUILD_NUM}) with Built-in StikJIT support."

          export VERSION BUILD_NUM IPA_SIZE IPA_SHA256 RELEASE_DATE DOWNLOAD_URL REPO
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path("altstore.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          repo = os.environ["REPO"]
          owner = repo.split("/")[0]
          data["website"] = f"https://github.com/{repo}"
          data["iconURL"] = f"https://raw.githubusercontent.com/{repo}/main/Platform/Assets.xcassets/AppIcon.appiconset/Icon.png"
          app = data["apps"][0]
          app["iconURL"] = data["iconURL"]
          new_version = {
              "version": os.environ["VERSION"],
              "buildVersion": os.environ["BUILD_NUM"],
              "buildNumber": os.environ["BUILD_NUM"],
              "date": os.environ["RELEASE_DATE"],
              "localizedDescription": "UTM with Built-in StikJIT (UTMJITHelper.appex + StikJIT.framework with 16-digit hex address patch).",
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "size": int(os.environ["IPA_SIZE"]),
              "sha256": os.environ["IPA_SHA256"],
              "minOSVersion": "15.0",
          }
          versions = [v for v in app.get("versions", []) if v.get("downloadURL") != new_version["downloadURL"]]
          app["versions"] = [new_version] + versions[:9]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          git commit -m "chore(altstore): update altstore.json for ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
